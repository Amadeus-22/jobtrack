name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q
      - run: python -m jobtrack --date 2026-09-28 validate
        env:
          PYTHONPATH: src
